<!doctype html>
<html class="light" dir="ltr" lang="en" style="height: 100%;">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home - Bloxtip</title>
  <link rel="icon" type="image/png" href="github.com/amr010920/revlistblox/blob/main/17a0cd380d7df792715bdfac32e6054f-removebg-preview.png?raw=true">

  <style>
    :root {
      --theme-navbar-bg: #0074BD;
      --theme-primary: #02b757;
      --theme-primary-hover: #00cc61;
      --theme-chat-blue: #00a2ff;
    }

        /* TOP NAVBAR */
    .navbar {
      z-index: 1050;
      height: 40px;
      background-color: var(--theme-navbar-bg);
      box-shadow: 0 1px 4px rgba(25, 25, 25, 0.3);
      width: 100vw;
      margin-left: calc(-50vw + 50%);
      display: flex;
      align-items: center;
      padding: 0 15px;
    }

    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; }
    body {
      background: #e3e3e3;
      color: #191919;
      font-family: 'Source Sans Pro', Arial, sans-serif;
      font-size: 16px;
      display: flex;
      flex-direction: column;
      position: relative;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-container">
      <div class="left-section">
        <button class="menu-toggle-btn" id="sidebar-toggle-btn" onclick="toggleSidebar()" title="Menu">
          <div class="hamburger-icon">
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
            <div class="hamburger-line"></div>
          </div>
        </button>
        <button class="logo-btn" onclick="window.location.href='./'" title="revstuff">
          <img src="github.com/amr010920/revlistblox/blob/main/17a0cd380d7df792715bdfac32e6054f-removebg-preview.png?raw=true" alt="Bloxtip" class="logo-img">
        </button>
        </button>
        <div class="header-nav">
        </div>
      </div>
    </div>
  </nav>

</body>
</html>
